<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Sign-in complete</title>
<style>body{font-family:-apple-system,Helvetica,Arial,sans-serif;max-width:640px;margin:40px auto;padding:0 16px}
code{display:block;word-break:break-all;background:#f2f2f2;padding:12px;border-radius:8px;font-size:15px}
button{font-size:17px;padding:10px 18px;margin-top:12px}</style></head>
<body>
<h2 id="h">Tesla sign-in complete</h2>
<p id="p">Copy this code and paste it into your chat with Ada within a few minutes (it expires quickly):</p>
<code id="c"></code>
<button id="b">Copy code</button>
<script>
var q=new URLSearchParams(location.search),code=q.get('code'),err=q.get('error');
var c=document.getElementById('c');
if(code){c.textContent=code;}
else{document.getElementById('h').textContent='No code received';
document.getElementById('p').textContent=err?('Tesla returned an error: '+err+' '+(q.get('error_description')||'')):'Open this page from the Tesla sign-in link.';
c.style.display='none';document.getElementById('b').style.display='none';}
document.getElementById('b').onclick=function(){navigator.clipboard.writeText(code).then(function(){document.getElementById('b').textContent='Copied';});};
</script>
</body></html>
